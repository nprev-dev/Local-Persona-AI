<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Local Persona AI</title>
  <style>
    body {
      margin: 0;
      background: #0f1115;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      flex-direction: column;
      gap: 16px;
    }
    #status {
      font-size: 14px;
      opacity: 0.5;
    }
    .title {
      font-size: 22px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="title">Local Persona AI</div>
  <div id="status">Starting backend...</div>

  <script>
    async function waitForBackend() {
      const status = document.getElementById("status");
      let attempts = 0;

      while (true) {
        try {
          const res = await fetch("http://localhost:8000/memory-count", {
            signal: AbortSignal.timeout(2000)
          });
          if (res.ok) {
            status.textContent = "Ready! Loading...";
            window.location.href = "http://localhost:8000";
            return;
          }
        } catch (_) {}
        attempts++;
        status.textContent = `Starting backend... (${attempts * 2}s)`;
        await new Promise(r => setTimeout(r, 2000));
      }
    }
    waitForBackend();
  </script>
</body>
</html>
