<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Persona</title>
  <style>
    :root {
      --bg: #0b0d12;
      --bg2: #12151c;
      --text: #e7ecf3;
      --text-dim: #8a93a6;
      --accent: #22d3ee;
      --accent-glow: rgba(34, 211, 238, 0.25);
      --border: #1e2330;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background:
        radial-gradient(1200px 600px at 50% -10%, rgba(34,211,238,0.08), transparent 60%),
        var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      flex-direction: column;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 22px;
      animation: rise 0.6s cubic-bezier(.2,.7,.3,1);
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Orbital spinner */
    .orbit {
      position: relative;
      width: 64px;
      height: 64px;
    }
    .orbit .core {
      position: absolute;
      top: 50%; left: 50%;
      width: 14px; height: 14px;
      margin: -7px 0 0 -7px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 18px 3px var(--accent-glow);
      animation: pulse 1.6s ease-in-out infinite;
    }
    .orbit .ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 2px solid transparent;
      border-top-color: var(--accent);
      animation: spin 1s linear infinite;
    }
    .orbit .ring.two {
      inset: 10px;
      border-top-color: transparent;
      border-right-color: rgba(34,211,238,0.5);
      animation-duration: 1.5s;
      animation-direction: reverse;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse {
      0%, 100% { transform: scale(1);   opacity: 1; }
      50%      { transform: scale(1.4); opacity: 0.7; }
    }

    .title {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 0.3px;
      background: linear-gradient(90deg, #fff, var(--accent));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    #status {
      font-size: 13px;
      color: var(--text-dim);
      min-height: 18px;
      letter-spacing: 0.2px;
    }

    .footer {
      position: fixed;
      bottom: 22px;
      font-size: 11px;
      color: var(--text-dim);
      opacity: 0.55;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="orbit">
      <div class="ring"></div>
      <div class="ring two"></div>
      <div class="core"></div>
    </div>
    <div class="title">AI Persona</div>
    <div id="status">Starting backend…</div>
  </div>

  <div class="footer">Running fully local · No cloud · No telemetry</div>

  <script>
    async function waitForBackend() {
      const status = document.getElementById("status");
      let attempts = 0;

      while (true) {
        try {
          const res = await fetch("http://localhost:8000/memory-count", {
            signal: AbortSignal.timeout(2000)
          });
          if (res.ok) {
            status.textContent = "Ready — loading your companion…";
            window.location.href = "http://localhost:8000";
            return;
          }
        } catch (_) {}
        attempts++;
        const secs = attempts * 2;
        if (secs < 15) {
          status.textContent = "Starting backend…";
        } else if (secs < 40) {
          status.textContent = "Loading models… (first launch takes a bit)";
        } else {
          status.textContent = `Still starting… (${secs}s)`;
        }
        await new Promise(r => setTimeout(r, 2000));
      }
    }
    waitForBackend();
  </script>
</body>
</html>
