// HELPERS
// ─────────────────────────────────────────────────────────────
function uid(){ return Math.random().toString(36).slice(2,10); }
function clamp(v,min,max){ return Math.max(min,Math.min(max,v)); }

const { useState, useEffect, useRef, useCallback, useReducer, createContext, useContext } = React;

// BACKEND CONFIG

const API = ""; // same origin as the served page (FastAPI on :8000)

// Maps a backend personality.json object -> UI character object.
function personalityToChar(p) {
  return {
    id:            p.id || 'default',
    name:          p.name           || 'Assistant',
    avatarColor:   p.avatar_color   || '#22d3ee',
    avatarInitial: p.avatar_initial || (p.name ? p.name.charAt(0).toUpperCase() : 'A'),
    persona:       p.persona        || '',
    systemPrompt:  p.base_prompt    || '',
    ttsEnabled:    p.tts_enabled !== false,
    visualPanel:   false,
    voiceStyle:    p.voice_style    || 'neutral',
    responseStyle: p.response_style || 'balanced',
    // keep the original arrays around so saving doesn't lose them
    _traits:           p.traits           || [],
    _speechStyle:      p.speech_style      || [],
    _hardConstraints:  p.hard_constraints  || [],
    _hardRules:        p.hard_rules        || [],
    _language:         p.language          || 'English',
  };
}

// Maps a UI character object -> backend personality.json payload.
function charToPersonality(c) {
  return {
    name:             c.name,
    avatar_color:     c.avatarColor,
    avatar_initial:   c.avatarInitial,
    persona:          c.persona,
    base_prompt:      c.systemPrompt,
    traits:           c._traits          || [],
    speech_style:     c._speechStyle      || [],
    hard_constraints: c._hardConstraints  || [],
    hard_rules:       c._hardRules        || [],
    tts_enabled:      !!c.ttsEnabled,
    voice_style:      c.voiceStyle,
    response_style:   c.responseStyle,
    language:         c._language || 'English',
  };
}

};

function reducer(s, a) {
  switch(a.type) {
    case 'SET_PAGE':           return { ...s, page: a.v };
    case 'TOGGLE_SIDEBAR':     return { ...s, sidebarOpen: !s.sidebarOpen };
    case 'SET_MODEL':          return { ...s, selectedModel: a.v, modelPickerOpen: false };
    case 'SET_MODELS':         return { ...s, models: a.v };
    case 'SET_CHARACTERS':     return { ...s, characters: a.v.length ? a.v : s.characters };
    case 'SET_MEMORY_COUNT':   return { ...s, memoryCount: a.v };
    case 'TOGGLE_MODEL_PICKER':return { ...s, modelPickerOpen: !s.modelPickerOpen };
    case 'CLOSE_MODEL_PICKER': return { ...s, modelPickerOpen: false };
    case 'NEW_CONV': {
      const id = uid();
      return {
        ...s,
        conversations: [{ id, title: 'New chat', messages: [], createdAt: Date.now() }, ...s.conversations],
        activeId: id,
        messages: [],
        streaming: false,
        streamContent: '',
        page: 'chat',
      };
    }
    case 'LOAD_CONV': {
      const c = s.conversations.find(x => x.id === a.v);
      if (!c) return s;
      return { ...s, activeId: a.v, messages: c.messages || [], streaming: false, streamContent: '', page: 'chat' };
    }
    case 'ADD_MSG': {
      const msgs = [...s.messages, a.v];
      const convs = s.conversations.map(c => c.id === s.activeId
        ? { ...c, messages: msgs, title: a.v.role === 'user' && c.title === 'New chat' ? a.v.content.slice(0, 42) : c.title }
        : c
      );
      return { ...s, messages: msgs, conversations: convs };
    }
    case 'SET_STREAMING':   return { ...s, streaming: a.v };
    case 'APPEND_STREAM':   return { ...s, streamContent: s.streamContent + a.v };
    case 'SET_PHASE':       return { ...s, streamPhase: a.v };
    case 'COMMIT_STREAM': {
      const last = s.messages[s.messages.length - 1];
      if (!last || last.role !== 'assistant') return { ...s, streaming: false, streamContent: '', streamPhase: '' };
      const updated = { ...last, content: s.streamContent || last.content };
      const msgs = [...s.messages.slice(0, -1), updated];
      const convs = s.conversations.map(c => c.id === s.activeId ? { ...c, messages: msgs } : c);
      return { ...s, streaming: false, streamContent: '', streamPhase: '', messages: msgs, conversations: convs };
    }
    case 'SET_ACTIVE_CHAR': return { ...s, activeCharId: a.v };
    case 'UPSERT_CHAR': {
      const exists = s.characters.find(c => c.id === a.v.id);
      const chars = exists
        ? s.characters.map(c => c.id === a.v.id ? a.v : c)
        : [...s.characters, a.v];
      return { ...s, characters: chars };
    }
    case 'DELETE_CHAR': {
      const chars = s.characters.filter(c => c.id !== a.v);
      if (chars.length === 0) return s;  // never remove the last one
      const newActive = s.activeCharId === a.v ? chars[0].id : s.activeCharId;
      return { ...s, characters: chars, activeCharId: newActive };
    }
    default: return s;
  }
}

// ─────────────────────────────────────────────────────────────
// REAL BACKEND STREAMING  (replaces mockStream)
// Streams tokens from POST /chat (NDJSON). Yields token strings.
// Captures the final {done:true, memory_count} frame via onDone callback.
// ─────────────────────────────────────────────────────────────
async function* chatStream(userInput, signal, onDone) {
  const res = await fetch(API + "/chat", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ user_input: userInput }),
    signal,
  });
  if (!res.ok || !res.body) throw new Error("chat request failed");

  const reader  = res.body.getReader();
  const decoder = new TextDecoder();
  let buffer = "";

  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, { stream: true });

    let nl;
    while ((nl = buffer.indexOf("\n")) >= 0) {
      const line = buffer.slice(0, nl).trim();
      buffer = buffer.slice(nl + 1);
      if (!line) continue;
      let data;
      try { data = JSON.parse(line); } catch { continue; }
      if (data.token) yield data.token;
      if (data.done && onDone) onDone(data);
    }
  }
}

// ─────────────────────────────────────────────────────────────
// AUDIO ENGINE  (ported from the original frontend)
// Streams sentence-by-sentence WAV chunks from POST /speak,
// plays them gaplessly via WebAudio, and stitches a single WAV
// blob so the <audio> player bar shows full duration + replay.
// ─────────────────────────────────────────────────────────────
let ttsPlaying = false;
let ttsPending = null;

function audioBufferToWav(buffer) {
  const numCh = buffer.numberOfChannels;
  const sr    = buffer.sampleRate;
  const frames = buffer.length;
  const bytesPerSample = 2;
  const dataSize = frames * numCh * bytesPerSample;
  const ab = new ArrayBuffer(44 + dataSize);
  const view = new DataView(ab);
  const wr = (off, str) => { for (let i=0;i<str.length;i++) view.setUint8(off+i, str.charCodeAt(i)); };
  wr(0,'RIFF'); view.setUint32(4, 36+dataSize, true); wr(8,'WAVE'); wr(12,'fmt ');
  view.setUint32(16,16,true); view.setUint16(20,1,true); view.setUint16(22,numCh,true);
  view.setUint32(24,sr,true); view.setUint32(28,sr*numCh*bytesPerSample,true);
  view.setUint16(32,numCh*bytesPerSample,true); view.setUint16(34,16,true);
  wr(36,'data'); view.setUint32(40,dataSize,true);
  let off = 44;
  for (let i=0;i<frames;i++) {
    for (let ch=0; ch<numCh; ch++) {
      const s = Math.max(-1, Math.min(1, buffer.getChannelData(ch)[i]));
      view.setInt16(off, s<0 ? s*32768 : s*32767, true);
      off += 2;
    }
  }
  return new Blob([ab], { type: 'audio/wav' });
}

// Streams /speak, plays gaplessly, and resolves an <audio>-ready URL.
async function streamSpeak(text, audioEl, onSpeakingChange) {
  const res = await fetch(API + "/speak", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ text }),
  });
  if (res.status === 204 || !res.body) return;

  const reader  = res.body.getReader();
  const ctx     = new (window.AudioContext || window.webkitAudioContext)();
  const queue   = [];
  const allBuffers = [];
  let playing = false;
  let nextStart = 0;

  function playNext() {
    if (queue.length === 0) {
      playing = false;
      onSpeakingChange && onSpeakingChange(false);
      return;
    }
    playing = true;
    onSpeakingChange && onSpeakingChange(true);
    const buf = queue.shift();
    const src = ctx.createBufferSource();
    src.buffer = buf;
    src.connect(ctx.destination);
    const when = Math.max(ctx.currentTime, nextStart);
    src.start(when);
    nextStart = when + buf.duration;
    src.onended = playNext;
  }

  let leftover = new Uint8Array(0);
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    const merged = new Uint8Array(leftover.length + value.length);
    merged.set(leftover); merged.set(value, leftover.length);
    leftover = merged;

    while (leftover.length >= 4) {
      const len = (leftover[0]<<24)|(leftover[1]<<16)|(leftover[2]<<8)|leftover[3];
      if (leftover.length < 4 + len) break;
      const wav = leftover.slice(4, 4+len);
      leftover = leftover.slice(4+len);
      try {
        const decoded = await ctx.decodeAudioData(
          wav.buffer.slice(wav.byteOffset, wav.byteOffset + wav.byteLength)
        );
        allBuffers.push(decoded);
        queue.push(decoded);
        if (!playing) playNext();
      } catch (e) { /* skip bad chunk */ }
    }
  }

  // Stitch all decoded audio into one WAV for the player bar.
  if (allBuffers.length && audioEl) {
    const sr = allBuffers[0].sampleRate;
    const numCh = allBuffers[0].numberOfChannels;
    const total = allBuffers.reduce((n,b)=>n+b.length,0);
    const mergedBuf = ctx.createBuffer(numCh, total, sr);
    let off = 0;
    for (const b of allBuffers) {
      for (let ch=0; ch<numCh; ch++) mergedBuf.getChannelData(ch).set(b.getChannelData(ch), off);
      off += b.length;
    }
    const url = URL.createObjectURL(audioBufferToWav(mergedBuf));
    audioEl.src = url;
    audioEl.style.display = "block";
    audioEl.onended = () => URL.revokeObjectURL(url);
  }
}

// Public entry: speak text, preventing overlap between messages.
async function speakText(text, audioEl, onSpeakingChange) {
  if (ttsPlaying) { ttsPending = { text, audioEl, onSpeakingChange }; return; }
  ttsPlaying = true;
  try {
    await streamSpeak(text, audioEl, onSpeakingChange);
  } catch (e) { /* ignore */ }
  ttsPlaying = false;
  if (ttsPending) {
    const next = ttsPending; ttsPending = null;
    speakText(next.text, next.audioEl, next.onSpeakingChange);
  }
}

// ─────────────────────────────────────────────────────────────
// SYSTEM PULSE
// ─────────────────────────────────────────────────────────────
function SystemPulse({ streaming }) {
  const style = streaming
    ? { background: `linear-gradient(90deg,transparent 0%,${T.accent} 40%,${T.accent} 60%,transparent 100%)`, animation: 'pulse-glow 1.8s ease-in-out infinite' }
    : { background: `linear-gradient(90deg,transparent 5%,${T.accentSubtle} 30%,${T.accentSubtle} 70%,transparent 95%)` };
  return <div style={{ position:'fixed',top:0,left:0,right:0,height:2,zIndex:50,...style }} />;
}

                No conversations yet

            )}
            {filtered.map(conv => (
              <button
                key={conv.id}
                onClick={() => dispatch({ type:'LOAD_CONV', v:conv.id })}
                style={{
                  display:'block',width:'100%',textAlign:'left',
                  padding:'6px 10px',borderRadius:8,fontSize:12,border:'none',cursor:'pointer',
                  background: state.activeId === conv.id ? T.accentSubtle : 'transparent',
                  color: state.activeId === conv.id ? T.text : T.textSecondary,
                  marginBottom:1,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis',
                  position:'relative',
                }}

// ─────────────────────────────────────────────────────────────
// MESSAGE BUBBLE
// ─────────────────────────────────────────────────────────────
function MessageBubble({ message, isLive, streamContent, streamPhase, activeChar }) {
  const isUser = message.role === 'user';
  const [copied, setCopied] = useState(false);
  const [speaking, setSpeaking] = useState(false);
  const content = isLive ? streamContent || message.content : message.content;
  const { state } = useStore();
  const audioRef = useRef(null);

  const handleCopy = () => {
    navigator.clipboard?.writeText(content);
    setCopied(true);
    setTimeout(() => setCopied(false), 2000);
  };

  const handleSpeak = () => {
    if (!content.trim()) return;
    speakText(content, audioRef.current, setSpeaking);
  };

  // Auto-speak once when an assistant message finishes streaming (if TTS on).
  const spokenRef = useRef(false);
  useEffect(() => {
    if (isUser) return;
    if (isLive) return;                       // wait until streaming done
    if (spokenRef.current) return;            // only once
    if (!activeChar.ttsEnabled) return;
    if (!message.content.trim()) return;
    spokenRef.current = true;
    speakText(message.content, audioRef.current, setSpeaking);
  }, [isLive, isUser, activeChar.ttsEnabled, message.content]);

  if (isUser) {
    return (
      <div style={{ display:'flex',justifyContent:'flex-end',marginBottom:16,animation:'fade-in .2s ease' }}>
        <div style={{ maxWidth:'82%',padding:'10px 14px',fontSize:14,lineHeight:1.6,
          background:T.userBubble,color:T.userBubbleText,
          borderRadius:'18px 18px 4px 18px',whiteSpace:'pre-wrap',wordBreak:'break-word',
          border:`1px solid rgba(79,209,255,0.1)` }}>
          {message.content}
        </div>
      </div>
    );
  }

  return (
    <div style={{ display:'flex',gap:10,marginBottom:16,animation:'fade-in .2s ease' }}>
      {/* Avatar */}
      <div style={{ width:30,height:30,borderRadius:9,flexShrink:0,
        background:activeChar.avatarColor+'18',border:`1px solid ${activeChar.avatarColor}30`,
        display:'flex',alignItems:'center',justifyContent:'center',marginTop:1,
        fontSize:12,fontWeight:700,color:activeChar.avatarColor }}>
        {activeChar.avatarInitial}
      </div>
      <div style={{ flex:1,minWidth:0 }}>
        <div style={{ fontSize:11,color:T.textTertiary,marginBottom:4,fontWeight:500,
          display:'flex',alignItems:'center',gap:7 }}>
          {activeChar.name}
          {speaking && (
            <span style={{ display:'flex',alignItems:'center',gap:4,color:T.accent }}>
              <span style={{ width:5,height:5,borderRadius:'50%',background:T.accent,display:'inline-block',
                animation:'pulse-dot 1.4s ease-in-out infinite' }} />
              Speaking
            </span>
          )}
        </div>
        {isLive && streamPhase && (
          <div style={{ fontSize:12,color:T.textTertiary,marginBottom:6,display:'flex',alignItems:'center',gap:6 }}>
            <span style={{ width:5,height:5,borderRadius:'50%',background:T.accent,display:'inline-block',
              animation:'pulse-dot 1.4s ease-in-out infinite' }} />
            {streamPhase}
          </div>
        )}
        <div style={{ fontSize:14,lineHeight:1.65,color:T.text,whiteSpace:'pre-wrap',wordBreak:'break-word' }}>
          {content}
          {isLive && state.streaming && (
            <span style={{ display:'inline-block',width:'0.45ch',height:'0.9em',marginLeft:'0.1ch',
              background:T.accent,verticalAlign:'text-bottom',animation:'blink 1.1s steps(1,end) infinite' }} />
          )}
        </div>

        {/* Audio player bar — hidden until TTS produces audio */}
        <audio ref={audioRef} controls style={{ display:'none', marginTop:8, width:'100%', height:34 }} />

        {/* Action buttons */}
        {!isLive && (
          <div style={{ display:'flex',alignItems:'center',gap:4,marginTop:6 }}>
            <button onClick={handleCopy}
              style={{ padding:'3px 6px',borderRadius:6,background:'transparent',
                border:'none',cursor:'pointer',color:T.textTertiary,display:'flex',alignItems:'center',gap:4,fontSize:11 }}>
              <i className={`ti ${copied ? 'ti-check' : 'ti-copy'}`} style={{ fontSize:12 }} />
              {copied ? 'Copied' : 'Copy'}
            </button>
            {activeChar.ttsEnabled && (
              <button onClick={handleSpeak}
                style={{ padding:'3px 6px',borderRadius:6,background:'transparent',
                  border:'none',cursor:'pointer',color:T.textTertiary,display:'flex',alignItems:'center',gap:4,fontSize:11 }}>
                <i className="ti ti-volume" style={{ fontSize:12 }} />
                Speak
              </button>
            )}
          </div>
        )}
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// INPUT AREA
// ─────────────────────────────────────────────────────────────
function InputArea() {
  const { state, dispatch } = useStore();
  const [input, setInput] = useState('');
  const textareaRef = useRef(null);
  const abortRef = useRef(null);

  useEffect(() => {
    const el = textareaRef.current;
    if (!el) return;
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 200) + 'px';
  }, [input]);

  useEffect(() => {
    if (!state.streaming) textareaRef.current?.focus();
  }, [state.streaming]);
  

  const stop = useCallback(() => {
    abortRef.current?.abort();
    dispatch({ type:'COMMIT_STREAM' });
  }, [dispatch]);

  const send = useCallback(async () => {
    const content = input.trim();
    if (!content || state.streaming) return;
    if (!state.selectedModel) return;
    setInput('');

    if (!state.activeId) dispatch({ type:'NEW_CONV' });

    const userMsg = { id:uid(), role:'user', content, timestamp:Date.now() };
    dispatch({ type:'ADD_MSG', v:userMsg });
    const assistMsg = { id:uid(), role:'assistant', content:'', timestamp:Date.now() };
    dispatch({ type:'ADD_MSG', v:assistMsg });
    dispatch({ type:'SET_STREAMING', v:true });
    dispatch({ type:'SET_PHASE', v:'Generating…' });

    const ctrl = new AbortController();
    abortRef.current = ctrl;

    try {
      for await (const chunk of chatStream(content, ctrl.signal, (done) => {
        // onDone frame: update memory stats
        if (done && done.memory_count) {
          dispatch({ type:'SET_MEMORY_COUNT', v:done.memory_count });
        }
      })) {
        dispatch({ type:'APPEND_STREAM', v:chunk });
        dispatch({ type:'SET_PHASE', v:'' });
      }
    } catch(e) {
      if (e.name !== 'AbortError') dispatch({ type:'APPEND_STREAM', v:'\n\n*(Error contacting backend)*' });
    } finally {
      dispatch({ type:'COMMIT_STREAM' });
      abortRef.current = null;
    }
  }, [input, state, dispatch]);

  const onKey = e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      if (!state.streaming) send();
    }
  };

  const canSend = input.trim() && state.selectedModel && !state.streaming;

  return (
    <div style={{ padding:'6px 16px 16px',maxWidth:740,margin:'0 auto',width:'100%' }}>
      <div style={{ display:'flex',alignItems:'flex-end',gap:10,borderRadius:18,padding:'10px 12px',
        background:T.inputBg,border:`1px solid ${state.streaming ? T.borderFocus : T.inputBorder}`,
        boxShadow: state.streaming ? `0 0 0 1px ${T.accentGlow}` : 'none',
        transition:'border-color .2s,box-shadow .2s' }}>
        <textarea
          ref={textareaRef}
          value={input}
          onChange={e => setInput(e.target.value)}
          onKeyDown={onKey}
          placeholder={state.selectedModel ? 'Message…' : 'Select a model first…'}
          rows={1}
          disabled={!state.selectedModel}
          style={{ flex:1,background:'transparent',border:'none',outline:'none',
            resize:'none',fontSize:14,lineHeight:1.55,color:T.text,maxHeight:200,
            fontFamily:'inherit',opacity: !state.selectedModel ? 0.4 : 1 }}
        />
        {state.streaming ? (
          <button onClick={stop}
            style={{ padding:'7px 8px',borderRadius:11,border:'none',cursor:'pointer',flexShrink:0,
              background:T.errorSubtle,color:T.error,transition:'background .15s' }}>
            <i className="ti ti-square" style={{ fontSize:15 }} />
          </button>
        ) : (
          <button onClick={send} disabled={!canSend}
            style={{ padding:'7px 8px',borderRadius:11,border:'none',cursor:'pointer',flexShrink:0,
              background: canSend ? T.accent : T.bgTertiary,
              color: canSend ? T.onAccent : T.textTertiary,
              opacity: canSend ? 1 : 0.45,transition:'background .15s,opacity .15s' }}>
            <i className="ti ti-send" style={{ fontSize:15 }} />
          </button>
        )}
      </div>
      <div style={{ textAlign:'center',fontSize:11,color:T.textTertiary,marginTop:5 }}>
        <kbd style={{ fontFamily:'monospace',background:T.bgTertiary,padding:'1px 5px',borderRadius:4 }}>Enter</kbd> to send ·{' '}
        <kbd style={{ fontFamily:'monospace',background:T.bgTertiary,padding:'1px 5px',borderRadius:4 }}>Shift+Enter</kbd> for new line
      </div>
    </div>
  );
}

        style={{ flex:1,overflowY:'auto' }}

              {activeChar.name}
            </h2>
            <p style={{ fontSize:13,color:T.textSecondary,textAlign:'center',

                style={{ display:'flex',alignItems:'center',gap:7,padding:'7px 14px',borderRadius:9,
                  fontSize:12,cursor:'pointer',background:T.bgSecondary,
                  border:`1px solid ${T.border}`,color:T.textSecondary }}>
                <i className="ti ti-user-circle" style={{ fontSize:13,color:T.accent }} />

              </button>
              <button onClick={() => dispatch({ type:'TOGGLE_MODEL_PICKER' })}
                style={{ display:'flex',alignItems:'center',gap:7,padding:'7px 14px',borderRadius:9,
                  fontSize:12,cursor:'pointer',background:T.bgSecondary,
                  border:`1px solid ${T.border}`,color:T.textSecondary }}>
                <i className="ti ti-cpu" style={{ fontSize:13,color:T.accent }} />
                Switch Model
              </button>
            </div>
          </div>
        ) : (
          <div style={{ maxWidth:740,margin:'0 auto',padding:'24px 16px' }}>
            {state.messages.map((msg, i) => {
              const isLast = i === state.messages.length - 1;
              const isLive = isLast && msg.role === 'assistant' && state.streaming;
              return (
                <MessageBubble
                  key={msg.id}
                  message={msg}
                  isLive={isLive}
                  streamContent={state.streamContent}
                  streamPhase={state.streamPhase}
                  activeChar={activeChar}
                />
              );
            })}
          </div>
        )}
      </div>
      <InputArea />
    </div>
  );
}

// CHARACTERS PAGE
// ─────────────────────────────────────────────────────────────

const AVATAR_COLORS = ['#22d3ee','#a78bfa','#f5a524','#3ddc97','#ff6b6b','#f472b6','#60a5fa','#fb923c'];
const VOICE_STYLES = ['neutral','formal','casual','expressive'];
const RESPONSE_STYLES = ['concise','balanced','detailed'];

function CharactersPage() {
  const { state, dispatch } = useStore();
  const [dropOpen, setDropOpen] = useState(false);
  const [editing, setEditing] = useState(null); // null = view mode, char object = edit mode
  const [confirmDelete, setConfirmDelete] = useState(null);
  const dropRef = useRef(null);

  const activeChar = state.characters.find(c => c.id === state.activeCharId) || state.characters[0];

  // Persist a character to its own persona file on the backend.
  const persistChar = (char) => {
    dispatch({ type:'UPSERT_CHAR', v:char });
    fetch(API + "/personas/" + char.id, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(charToPersonality(char)),
    }).catch(() => {});
  };

  // Click outside to close dropdown
  useEffect(() => {
    if (!dropOpen) return;
    const handler = e => { if (dropRef.current && !dropRef.current.contains(e.target)) setDropOpen(false); };
    document.addEventListener('mousedown', handler);
    return () => document.removeEventListener('mousedown', handler);
  }, [dropOpen]);

  const startNew = () => {
    setEditing({
      id: uid(),
      name: '',
      avatarColor: AVATAR_COLORS[Math.floor(Math.random() * AVATAR_COLORS.length)],
      avatarInitial: '',
      persona: '',
      systemPrompt: '',
      ttsEnabled: false,
      visualPanel: false,
      voiceStyle: 'neutral',
      responseStyle: 'balanced',
    });
    setDropOpen(false);
  };

  const startEdit = (char) => {
    setEditing({ ...char });
    setDropOpen(false);
  };

  const saveChar = async () => {
    if (!editing.name.trim()) return;
    const isNew = !state.characters.find(c => c.id === editing.id);

    if (isNew) {
      // Create the persona file on the backend first to get a real id.
      try {
        const r = await fetch(API + "/personas/new", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name: editing.name.trim() }),
        });
        const data = await r.json();
        const realId = data.id;
        const char = {
          ...editing,
          id: realId,
          avatarInitial: editing.avatarInitial || editing.name.charAt(0).toUpperCase(),
        };
        // Save the full details to the new persona, then activate it.
        await fetch(API + "/personas/" + realId, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(charToPersonality(char)),
        });
        dispatch({ type:'UPSERT_CHAR', v:char });
        await fetch(API + "/personas/" + realId + "/activate", { method: "POST" });
        dispatch({ type:'SET_ACTIVE_CHAR', v:realId });
      } catch (e) { /* ignore */ }
    } else {
      const char = {
        ...editing,
        avatarInitial: editing.avatarInitial || editing.name.charAt(0).toUpperCase(),
      };
      persistChar(char);
    }
    setEditing(null);
  };

  const cancelEdit = () => setEditing(null);

  const selectChar = (id) => {
    dispatch({ type:'SET_ACTIVE_CHAR', v:id });
    setDropOpen(false);
    // Tell the backend to switch the active persona (also switches voice).
    fetch(API + "/personas/" + id + "/activate", { method: "POST" }).catch(() => {});
  };

  const doDelete = (id) => {
    dispatch({ type:'DELETE_CHAR', v:id });
    setConfirmDelete(null);
    fetch(API + "/personas/" + id, { method: "DELETE" })
      .then(r => r.json())
      .then(data => {
        // Backend may have switched active to another persona.
        if (data && data.active) dispatch({ type:'SET_ACTIVE_CHAR', v:data.active });
      })
      .catch(() => {});
  };

  // If editing mode
  if (editing) {
    return (
      <CharacterEditor
        char={editing}
        onChange={setEditing}
        onSave={saveChar}
        onCancel={cancelEdit}
        isNew={!state.characters.find(c=>c.id===editing.id)}
      />
    );
  }

  return (
    <div style={{ flex:1,overflowY:'auto',padding:'32px 28px' }}>
      <div style={{ maxWidth:680,margin:'0 auto' }}>

        {/* Page header */}
        <div style={{ marginBottom:28 }}>
          <h1 style={{ fontSize:18,fontWeight:600,color:T.text,marginBottom:5 }}>Characters</h1>
          <p style={{ fontSize:13,color:T.textSecondary,lineHeight:1.55 }}>
            Create and switch between AI personas. Each character has its own system prompt and settings.
          </p>
        </div>

        {/* Character switcher dropdown */}
        <div style={{ marginBottom:28 }}>
          <label style={{ fontSize:11,color:T.textTertiary,fontWeight:500,
            textTransform:'uppercase',letterSpacing:'.08em',display:'block',marginBottom:8 }}>
            Active Character
          </label>
          <div style={{ display:'flex',gap:10 }}>
            <div ref={dropRef} style={{ position:'relative',flex:1 }}>
              <button
                onClick={() => setDropOpen(v => !v)}
                style={{ display:'flex',alignItems:'center',gap:10,width:'100%',padding:'10px 14px',
                  borderRadius:11,background:T.bgSecondary,border:`1px solid ${dropOpen ? T.borderFocus : T.border}`,
                  cursor:'pointer',fontSize:13,textAlign:'left',
                  boxShadow: dropOpen ? `0 0 0 1px ${T.accentGlow}` : 'none',
                  transition:'border-color .15s,box-shadow .15s' }}
              >
                <div style={{ width:28,height:28,borderRadius:8,
                  background:activeChar.avatarColor+'20',border:`1px solid ${activeChar.avatarColor}30`,
                  display:'flex',alignItems:'center',justifyContent:'center',
                  fontSize:12,fontWeight:700,color:activeChar.avatarColor,flexShrink:0 }}>
                  {activeChar.avatarInitial}
                </div>
                <div style={{ flex:1,minWidth:0 }}>
                  <div style={{ fontSize:13,fontWeight:500,color:T.text }}>{activeChar.name}</div>
                  <div style={{ fontSize:11,color:T.textTertiary,overflow:'hidden',textOverflow:'ellipsis',
                    whiteSpace:'nowrap',marginTop:1 }}>
                    {activeChar.persona.slice(0,60)}{activeChar.persona.length>60?'…':''}
                  </div>
                </div>
                <i className={`ti ti-chevron-${dropOpen?'up':'down'}`} style={{ fontSize:14,color:T.textTertiary,flexShrink:0 }} />
              </button>

              {dropOpen && (
                <div style={{ position:'absolute',top:'calc(100% + 6px)',left:0,right:0,zIndex:100,
                  background:T.bgSecondary,border:`1px solid ${T.border}`,borderRadius:12,
                  overflow:'hidden',boxShadow:T.shadow.md,animation:'fade-in .12s ease' }}>
                  {state.characters.map(char => (
                    <button key={char.id}
                      onClick={() => selectChar(char.id)}
                      style={{ display:'flex',alignItems:'center',gap:9,width:'100%',
                        padding:'9px 12px',border:'none',cursor:'pointer',textAlign:'left',
                        background: char.id===state.activeCharId ? T.accentSubtle : 'transparent',
                        fontSize:13 }}
                    >
                      <div style={{ width:26,height:26,borderRadius:7,
                        background:char.avatarColor+'20',
                        display:'flex',alignItems:'center',justifyContent:'center',
                        fontSize:11,fontWeight:700,color:char.avatarColor,flexShrink:0 }}>
                        {char.avatarInitial}
                      </div>
                      <div style={{ flex:1,minWidth:0 }}>

function SettingRow({ label, description, icon, badge, indent, children }) {

function Toggle({ value, onChange, disabled }) {
  return (
    <button
      onClick={() => !disabled && onChange(!value)}
      style={{
        width:42, height:24, borderRadius:999, border:'none',
        background: value ? T.accent : T.bgTertiary,
        position:'relative', cursor: disabled ? 'not-allowed' : 'pointer',
        opacity: disabled ? 0.45 : 1,
        transition:'background .2s',
        flexShrink:0,
      }}
    >
      <span style={{
        position:'absolute', top:3, left: value ? 'calc(100% - 21px)' : 3,
        width:18, height:18, borderRadius:'50%',
        background: value ? T.onAccent : T.textTertiary,
        transition:'left .2s',
      }} />
    </button>
  );
}

function SelectInput({ value, options, onChange }) {
  return (
    <select
      value={value}
      onChange={e => onChange(e.target.value)}
      style={{ padding:'6px 10px',borderRadius:8,background:T.bgTertiary,
        border:`1px solid ${T.border}`,color:T.text,fontSize:12,cursor:'pointer',
        outline:'none',flexShrink:0 }}
    >
      {options.map(o => <option key={o} value={o}>{o.charAt(0).toUpperCase()+o.slice(1)}</option>)}
    </select>
  );
}

function SettingsPage() {
  const { state, dispatch } = useStore();

  const [temperature, setTemperature] = useState(0.7);
  const [streaming, setStreamingPref] = useState(true);
  const [saved, setSaved] = useState(false);

  const save = () => {
    setSaved(true);
    setTimeout(() => setSaved(false), 2000);
  };

  return (
    <div style={{ flex:1,overflowY:'auto',padding:'32px 28px' }}>
      <div style={{ maxWidth:580,margin:'0 auto' }}>
        <div style={{ marginBottom:28 }}>
          <h1 style={{ fontSize:18,fontWeight:600,color:T.text,marginBottom:5 }}>Settings</h1>
          <p style={{ fontSize:13,color:T.textSecondary }}>Configure your backend, generation parameters, and preferences.</p>
        </div>

        <Section title="Backend">
          <div style={{ marginBottom:16 }}>
            <label style={labelStyle}>API Endpoint</label>
            <input value={apiUrl} onChange={e=>setApiUrl(e.target.value)} style={inputStyle} />
            <div style={{ fontSize:11,color:T.textTertiary,marginTop:5 }}>
              The base URL of your inference server (e.g. Ollama, FastAPI, LiteLLM).
            </div>
          </div>
          <SettingRow label="Streaming Responses" description="Receive tokens as they are generated." icon="ti-bolt">
            <Toggle value={streaming} onChange={setStreamingPref} />
          </SettingRow>
        </Section>

        <Section title="Generation">
          <div style={{ marginBottom:16 }}>
            <label style={labelStyle}>
              Max Tokens — <span style={{ color:T.text,fontWeight:600 }}>{maxTokens.toLocaleString()}</span>
            </label>
            <input type="range" min={128} max={8192} step={128} value={maxTokens}
              onChange={e=>setMaxTokens(+e.target.value)}
              style={{ width:'100%',marginBottom:6 }} />
            <div style={{ display:'flex',justifyContent:'space-between',fontSize:11,color:T.textTertiary }}>
              <span>128</span><span>8192</span>
            </div>
          </div>
          <div>
            <label style={labelStyle}>
              Temperature — <span style={{ color:T.text,fontWeight:600 }}>{temperature.toFixed(1)}</span>
            </label>
            <input type="range" min={0} max={2} step={0.1} value={temperature}
              onChange={e=>setTemperature(parseFloat(e.target.value))}
              style={{ width:'100%',marginBottom:6 }} />
            <div style={{ display:'flex',justifyContent:'space-between',fontSize:11,color:T.textTertiary }}>
              <span>0 — Precise</span><span>2 — Creative</span>
            </div>
          </div>
        </Section>

        <Section title="Interface">
          <div style={{ display:'flex',flexDirection:'column',gap:14 }}>
            <SettingRow label="Compact Message Density" description="Reduce vertical spacing between messages." icon="ti-layout-list">
              <Toggle value={false} onChange={()=>{}} />
            </SettingRow>
            <SettingRow label="Show Token Usage" description="Display prompt/completion token counts below messages." icon="ti-hash">
              <Toggle value={false} onChange={()=>{}} />
            </SettingRow>
            <SettingRow label="Auto-scroll" description="Scroll to bottom as responses stream in." icon="ti-arrow-down">
              <Toggle value={true} onChange={()=>{}} />
            </SettingRow>
          </div>
        </Section>

        <div style={{ display:'flex',justifyContent:'flex-end' }}>
          <button onClick={save}
            style={{ padding:'9px 22px',borderRadius:10,border:'none',cursor:'pointer',
              fontSize:13,fontWeight:500,background: saved ? T.success : T.accent,
              color: T.onAccent,transition:'background .2s',display:'flex',alignItems:'center',gap:7 }}>
            {saved ? <><i className="ti ti-check" style={{ fontSize:14 }} />Saved</> : 'Save Settings'}
          </button>
        </div>

      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// ROOT APP
// ─────────────────────────────────────────────────────────────
function App() {
  const [state, dispatch] = useReducer(reducer, initialState);

  useEffect(() => {
    document.body.style.background = T.bg;
    document.body.style.color = T.text;
  }, []);

  // Bootstrap: pull models, personality, and memory stats from the backend.
  useEffect(() => {
    (async () => {
      // Models
      try {
        const r = await fetch(API + "/models");
        if (r.ok) {
          const data = await r.json();
          if (Array.isArray(data.models) && data.models.length) {
            MODELS = data.models;
            dispatch({ type:'SET_MODELS', v:data.models });
            dispatch({ type:'SET_MODEL', v: data.current || data.models[0].id });
          }
        }
      } catch (e) { /* backend not ready */ }

      // Personas -> full character list
      try {
        const r = await fetch(API + "/personas");
        if (r.ok) {
          const data = await r.json();
          const summaries = data.personas || [];
          // Fetch full data for each persona so the editor has everything.
          const chars = [];
          for (const s of summaries) {
            try {
              const pr = await fetch(API + "/personas/" + s.id);
              if (pr.ok) chars.push(personalityToChar(await pr.json()));
            } catch (e) { /* skip */ }
          }
          if (chars.length) {
            dispatch({ type:'SET_CHARACTERS', v:chars });
            dispatch({ type:'SET_ACTIVE_CHAR', v: data.active || chars[0].id });
          }
        }
      } catch (e) { /* ignore */ }

      // Memory counts
      try {
        const r = await fetch(API + "/memory-count");
        if (r.ok) {
          const c = await r.json();
          dispatch({ type:'SET_MEMORY_COUNT', v:c });
        }
      } catch (e) { /* ignore */ }
    })();
  }, []);

  const pages = {
    chat:       <ChatPage />,
    characters: <CharactersPage />,
    dashboard:  <DashboardPage />,
    settings:   <SettingsPage />,
  };

  return (
    <Ctx.Provider value={{ state, dispatch }}>
      <div style={{
        position:'fixed',inset:0,pointerEvents:'none',zIndex:0,
        backgroundImage:`radial-gradient(circle at 18% 0%,rgba(34,211,238,0.06),transparent 40%),radial-gradient(circle at 86% 105%,rgba(167,139,250,0.05),transparent 44%)`,
      }} />
      <div style={{
        position:'fixed',inset:0,pointerEvents:'none',zIndex:0,
        backgroundImage:`linear-gradient(rgba(255,255,255,0.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.025) 1px,transparent 1px)`,
        backgroundSize:'48px 48px',
        maskImage:'radial-gradient(ellipse at center, black 35%, transparent 78%)',
        WebkitMaskImage:'radial-gradient(ellipse at center, black 35%, transparent 78%)',
        animation:'grid-drift 70s linear infinite',
      }} />

      <SystemPulse streaming={state.streaming} />

      <div style={{ position:'relative',zIndex:1,display:'flex',flexDirection:'column',height:'100%',background:T.bg }}>
        <div style={{ display:'flex',flex:1,minHeight:0 }}>
          <Sidebar />
          <main style={{ flex:1,display:'flex',flexDirection:'column',minWidth:0,height:'100%',overflow:'hidden',background:'transparent' }}>
            {pages[state.page] || pages.chat}
          </main>
        </div>
      </div>

      <ModelPicker />
    </Ctx.Provider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
